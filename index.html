<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход — ShortLink</title>
    <link rel="stylesheet" href="/src/login.css" />
  </head>
  <body>
    <main class="login-page">
      <div class="orbit orbit--large" aria-hidden="true"></div>
      <div class="orbit orbit--small" aria-hidden="true"></div>

      <div class="decor decor--user" aria-hidden="true">
        <svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="7"/><path d="M13 39v-5c0-6 5-10 11-10s11 4 11 10v5"/></svg>
      </div>
      <div class="decor decor--shield" aria-hidden="true">
        <svg viewBox="0 0 48 48"><path d="M24 6 38 11v10c0 10-6 17-14 21-8-4-14-11-14-21V11Z"/><path d="m18 24 4 4 8-8"/></svg>
      </div>
      <div class="decor decor--lock" aria-hidden="true">
        <svg viewBox="0 0 48 48"><rect x="11" y="21" width="26" height="20" rx="3"/><path d="M17 21v-6a7 7 0 0 1 14 0v6"/><circle cx="24" cy="31" r="2"/></svg>
      </div>
      <div class="decor decor--fingerprint" aria-hidden="true">
        <svg viewBox="0 0 48 48"><path d="M12 24c0-7 5-12 12-12s12 5 12 12"/><path d="M16 28v-4a8 8 0 0 1 16 0c0 8 2 12 5 15"/><path d="M20 38c-2-4-2-9-2-14a6 6 0 0 1 12 0c0 10 3 15 6 18"/><path d="M24 20a4 4 0 0 1 4 4c0 9 2 14 5 18"/><path d="M24 28c0 6 1 10 4 14"/></svg>
      </div>
      <div class="decor decor--star" aria-hidden="true">
        <svg viewBox="0 0 48 48"><path d="m24 7 5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1Z"/></svg>
      </div>
      <div class="decor decor--bolt" aria-hidden="true">
        <svg viewBox="0 0 48 48"><path d="m27 5-15 23h11l-2 15 15-23H25Z"/></svg>
      </div>

      <section class="login-card" aria-labelledby="login-title">
        <div class="login-card__icon" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M9 24h20m-7-8 8 8-8 8"/><path d="M29 10h8a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4h-8"/></svg>
        </div>

        <h1 id="login-title">Вход</h1>
        <p class="login-card__subtitle">Войдите в свой аккаунт, чтобы<br />продолжить работу</p>

        <form class="login-form">
          <label for="email">Email</label>
          <div class="field">
            <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
            <input id="email" name="email" type="email" placeholder="Введите email" autocomplete="email" required />
          </div>

          <label for="password">Пароль</label>
          <div class="field">
            <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg>
            <input id="password" name="password" type="password" placeholder="Введите пароль" autocomplete="current-password" required />
            <button class="password-toggle" type="button" aria-label="Показать пароль" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </div>

          <button class="submit-button" type="submit">
            <span>Войти</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
          </button>
        </form>

        <div class="divider"><span>или</span></div>

        <div class="registration">
          <span>Нет аккаунта?</span>
          <a href="/register.html">Регистрация <span aria-hidden="true">›</span></a>
        </div>
      </section>
    </main>

    <script type="module" src="/src/login.js"></script>
  </body>
</html>
