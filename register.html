<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация — ShortLink</title>
    <link rel="stylesheet" href="/src/register.css" />
  </head>
  <body>
    <main class="register-page">
      <div class="orbit" aria-hidden="true"></div>
      <div class="backdrop backdrop--violet" aria-hidden="true"></div>
      <div class="backdrop backdrop--green" aria-hidden="true"></div>

      <div class="decor decor--user" aria-hidden="true">
        <svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="7"/><path d="M13 39v-5c0-6 5-10 11-10s11 4 11 10v5"/></svg>
      </div>
      <div class="decor decor--shield" aria-hidden="true">
        <svg viewBox="0 0 48 48"><path d="M24 6 38 11v10c0 10-6 17-14 21-8-4-14-11-14-21V11Z"/><path d="m18 24 4 4 8-8"/></svg>
      </div>
      <div class="decor decor--lock" aria-hidden="true">
        <svg viewBox="0 0 48 48"><rect x="11" y="21" width="26" height="20" rx="3"/><path d="M17 21v-6a7 7 0 0 1 14 0v6"/><path d="M24 29v5"/></svg>
      </div>
      <div class="decor decor--star" aria-hidden="true">
        <svg viewBox="0 0 48 48"><path d="m24 7 5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1Z"/></svg>
      </div>

      <section class="register-card" aria-labelledby="register-title">
        <div class="register-card__icon" aria-hidden="true">
          <svg viewBox="0 0 48 48"><circle cx="19" cy="15" r="7"/><path d="M8 37v-5c0-6 5-10 11-10 4 0 7 1 9 4"/><path d="M36 21v16M28 29h16"/></svg>
        </div>

        <h1 id="register-title">Регистрация</h1>
        <p class="register-card__subtitle">Создайте аккаунт, чтобы начать<br />использовать сервис</p>

        <form class="register-form">
          <label for="account-name">Имя аккаунта</label>
          <div class="field">
            <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3"/><path d="M6 20v-3c0-3 2-5 6-5s6 2 6 5v3"/></svg>
            <input id="account-name" name="accountName" type="text" placeholder="Введите имя аккаунта" autocomplete="username" required />
          </div>

          <label for="register-email">Email</label>
          <div class="field">
            <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
            <input id="register-email" name="email" type="email" placeholder="Введите email" autocomplete="email" required />
          </div>

          <label for="register-password">Пароль</label>
          <div class="field">
            <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg>
            <input id="register-password" name="password" type="password" placeholder="Введите пароль" autocomplete="new-password" required />
            <button class="password-toggle" type="button" aria-label="Показать пароль" aria-pressed="false" data-password-toggle="register-password">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </div>

          <label for="password-confirmation">Повторите пароль</label>
          <div class="field">
            <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg>
            <input id="password-confirmation" name="passwordConfirmation" type="password" placeholder="Повторите пароль" autocomplete="new-password" required />
            <button class="password-toggle" type="button" aria-label="Показать пароль" aria-pressed="false" data-password-toggle="password-confirmation">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </div>

          <button class="submit-button" type="submit">
            <span>Зарегистрироваться</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
          </button>
        </form>
      </section>
    </main>

    <script type="module" src="/src/register.js"></script>
  </body>
</html>
